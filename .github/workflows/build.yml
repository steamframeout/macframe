# Builds the all-in-one app: the SteamOS VM launcher (MacFrame fork with the VR work) with the Steam Frame
# Wireless Adapter bridge inside. Result: a pre-release on the Releases page with Frame-VR.zip (the .app, signed ad
# hoc: open it with right-click > Open the first time).
#
# Jobs hand files to each other through the Actions cache (keyed by run), not artifacts: artifact storage is a
# per-account quota that other repositories can use up; the cache and release assets are separate.
#
#   guest-x86   x86_64 Linux: Venus + zink for FEX-emulated x86 apps (Mesa, amd64 container)
#   guest-arm   arm64 Linux:  guest kernel, verified SteamOS rootfs, aarch64 Mesa + verify, initramfs, layer image
#   bridge      x86_64 Linux: Frame Bridge.app (QEMU from Homebrew bottles + the adapter bridge image)
#   app         macOS 26:     MoltenVK, KosmicKrisp, libepoxy, virglrenderer, libkrun, the launcher; bundle + zip
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the release with the app

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      # Cache keys from the clean checkout: the builds write into these trees (wmtr/build, guest/kernel's config,
      # crate targets), so hashing them again at save time gave other keys and nothing was ever reused
      - name: cache keys
        id: keys
        run: |
          echo "x86=mesa-x86-inputs-${{ hashFiles('guest/mesa/**', 'guest/venc/**', 'guest/vr/runtime/wmtr_native.*', 'guest/vr/include/**', 'wmtr/include/**', 'wmtr/src/transport_virtgpu.c', 'scripts/config.env', 'scripts/steps/10-rootfs.sh', 'scripts/builder/Dockerfile', 'scripts/keys/steamdeck-images.pem') }}" >> "$GITHUB_OUTPUT"
          echo "guest=guest-in-${{ hashFiles('guest/**', 'scripts/**', 'wmtr/include/**', 'host/vrhost/include/**') }}" >> "$GITHUB_OUTPUT"
          echo "kernel=kernel-v2-${{ hashFiles('guest/kernel/**') }}" >> "$GITHUB_OUTPUT"
          echo "hostdeps=host-deps-v1-${{ runner.arch }}-${{ hashFiles('host/moltenvk/**', 'host/kosmickrisp/**', 'host/libepoxy/**', 'host/virglrenderer/**', 'host/libkrun/**', 'host/dxmt/**', 'wmtr/**', 'guest/venc/include/**', 'guest/venc/src/venc_nal.c', 'guest/vr/include/**', 'host/vrhost/include/**') }}" >> "$GITHUB_OUTPUT"
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - name: reuse an earlier build of the same inputs
        id: prev
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.x86 }}
          path: |
            work/out/mesa-venus
            work/out/mesa-x86.inputs.json
            work/build/mesa-venus
      - name: arm64 emulation (the source fetch runs in an arm64 container)
        if: steps.prev.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Mesa for x86 (Venus x86_64 + i386, zink, fault reporter)
        if: steps.prev.outputs.cache-hit != 'true'
        run: guest/mesa/build.sh fetch x86
      - name: keep it for later runs
        if: steps.prev.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.x86 }}
          path: |
            work/out/mesa-venus
            work/out/mesa-x86.inputs.json
            work/build/mesa-venus

  guest-arm:
    needs: guest-x86
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      # Cache keys from the clean checkout: the builds write into these trees (wmtr/build, guest/kernel's config,
      # crate targets), so hashing them again at save time gave other keys and nothing was ever reused
      - name: cache keys
        id: keys
        run: |
          echo "x86=mesa-x86-inputs-${{ hashFiles('guest/mesa/**', 'guest/venc/**', 'guest/vr/runtime/wmtr_native.*', 'guest/vr/include/**', 'wmtr/include/**', 'wmtr/src/transport_virtgpu.c', 'scripts/config.env', 'scripts/steps/10-rootfs.sh', 'scripts/builder/Dockerfile', 'scripts/keys/steamdeck-images.pem') }}" >> "$GITHUB_OUTPUT"
          echo "guest=guest-in-${{ hashFiles('guest/**', 'scripts/**', 'wmtr/include/**', 'host/vrhost/include/**') }}" >> "$GITHUB_OUTPUT"
          echo "kernel=kernel-v2-${{ hashFiles('guest/kernel/**') }}" >> "$GITHUB_OUTPUT"
          echo "hostdeps=host-deps-v1-${{ runner.arch }}-${{ hashFiles('host/moltenvk/**', 'host/kosmickrisp/**', 'host/libepoxy/**', 'host/virglrenderer/**', 'host/libkrun/**', 'host/dxmt/**', 'wmtr/**', 'guest/venc/include/**', 'guest/venc/src/venc_nal.c', 'guest/vr/include/**', 'host/vrhost/include/**') }}" >> "$GITHUB_OUTPUT"
      - name: reuse the guest of an earlier run with the same inputs
        id: reuse
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.guest }}
          path: |
            work/out/Image
            work/out/Image.inputs.json
            work/out/initramfs.cpio.gz
            work/out/initramfs.cpio.gz.inputs.json
            work/out/steamac-layer.img
            work/out/steamac-layer.img.inputs.json
            work/out/mesa-venus
            work/out/mesa-venus.inputs.json
            work/out/mesa-aarch64.inputs.json
            work/out/mesa-x86.inputs.json
            work/out/kernel.config
            work/out/guest-toolchain.json
            work/cache/licenses
            work/cache/cargo-home/registry
            work/cache/kernel/*.tar.xz
            work/cache/dosfstools/*/*.tar.gz
            work/cache/e2fsprogs/*/*.tar.xz
            work/cache/btrfs-progs/*/*.tar.xz

      - name: free disk space
        if: steps.reuse.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache; df -h /
      - name: x86 emulation (the Mesa verify chroot checks the x86_64 and i386 builds)
        if: steps.reuse.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,386
      - uses: actions/cache/restore@v4
        if: steps.reuse.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.keys.outputs.x86 }}
          path: |
            work/out/mesa-venus
            work/out/mesa-x86.inputs.json
            work/build/mesa-venus
          fail-on-cache-miss: true
      - name: reuse an earlier kernel of the same inputs
        if: steps.reuse.outputs.cache-hit != 'true'
        id: kernel
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.kernel }}
          path: |
            work/out/Image
            work/out/Image.inputs.json
            work/out/kernel.config
            work/cache/kernel
      - name: guest kernel
        if: steps.reuse.outputs.cache-hit != 'true' && (steps.kernel.outputs.cache-hit != 'true')
        run: guest/kernel/build.sh
      - name: keep the kernel for later runs
        if: steps.reuse.outputs.cache-hit != 'true' && (steps.kernel.outputs.cache-hit != 'true')
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.kernel }}
          path: |
            work/out/Image
            work/out/Image.inputs.json
            work/out/kernel.config
            work/cache/kernel
      - name: SteamOS rootfs (Valve's signed OTA, verified)
        if: steps.reuse.outputs.cache-hit != 'true'
        run: scripts/build-image.sh builder rootfs
      - name: Mesa for aarch64 + verify
        if: steps.reuse.outputs.cache-hit != 'true'
        run: guest/mesa/build.sh fetch aarch64 verify
      - name: encode layer build logs (optional component)
        if: always() && steps.reuse.outputs.cache-hit != 'true'
        run: for f in work/build/mesa-venus/venc-*.log; do echo "== $f"; tail -5 "$f"; done 2>/dev/null || true
      - name: initramfs + layer image
        if: steps.reuse.outputs.cache-hit != 'true'
        run: |
          scripts/build-image.sh initramfs layer
          sudo chown -R "$(id -u):$(id -g)" work
      # what host/launcher/licenses.sh asks the build containers (the Mac has no Docker): guest Rust, busybox
      - name: guest toolchain record
        if: steps.reuse.outputs.cache-hit != 'true'
        run: scripts/guest-toolchain.sh
      - name: keep this guest for later runs with the same inputs
        if: steps.reuse.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.guest }}
          path: |
            work/out/Image
            work/out/Image.inputs.json
            work/out/initramfs.cpio.gz
            work/out/initramfs.cpio.gz.inputs.json
            work/out/steamac-layer.img
            work/out/steamac-layer.img.inputs.json
            work/out/mesa-venus
            work/out/mesa-venus.inputs.json
            work/out/mesa-aarch64.inputs.json
            work/out/mesa-x86.inputs.json
            work/out/kernel.config
            work/out/guest-toolchain.json
            work/cache/licenses
            work/cache/cargo-home/registry
            work/cache/kernel/*.tar.xz
            work/cache/dosfstools/*/*.tar.gz
            work/cache/e2fsprogs/*/*.tar.xz
            work/cache/btrfs-progs/*/*.tar.xz

  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: tools (rcodesign, macholib, Pillow)
        run: |
          pip3 install --break-system-packages macholib Pillow
          curl -fsSL -o /tmp/rcodesign.tar.gz \
            https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          tar -C /tmp -xzf /tmp/rcodesign.tar.gz
          sudo install /tmp/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign /usr/local/bin/rcodesign
      - name: Frame Bridge.app
        run: frame-bridge/macapp/build-app.sh "$PWD/work/bridge"
      - uses: actions/cache/save@v4
        with:
          key: frame-bridge-${{ github.run_id }}
          path: work/bridge/FrameBridge.zip

  app:
    needs: [guest-arm, bridge]
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      # Cache keys from the clean checkout: the builds write into these trees (wmtr/build, guest/kernel's config,
      # crate targets), so hashing them again at save time gave other keys and nothing was ever reused
      - name: cache keys
        id: keys
        run: |
          echo "x86=mesa-x86-inputs-${{ hashFiles('guest/mesa/**', 'guest/venc/**', 'guest/vr/runtime/wmtr_native.*', 'guest/vr/include/**', 'wmtr/include/**', 'wmtr/src/transport_virtgpu.c', 'scripts/config.env', 'scripts/steps/10-rootfs.sh', 'scripts/builder/Dockerfile', 'scripts/keys/steamdeck-images.pem') }}" >> "$GITHUB_OUTPUT"
          echo "guest=guest-in-${{ hashFiles('guest/**', 'scripts/**', 'wmtr/include/**', 'host/vrhost/include/**') }}" >> "$GITHUB_OUTPUT"
          echo "kernel=kernel-v2-${{ hashFiles('guest/kernel/**') }}" >> "$GITHUB_OUTPUT"
          echo "hostdeps=host-deps-v1-${{ runner.arch }}-${{ hashFiles('host/moltenvk/**', 'host/kosmickrisp/**', 'host/libepoxy/**', 'host/virglrenderer/**', 'host/libkrun/**', 'host/dxmt/**', 'wmtr/**', 'guest/venc/include/**', 'guest/venc/src/venc_nal.c', 'guest/vr/include/**', 'host/vrhost/include/**') }}" >> "$GITHUB_OUTPUT"
      - name: Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Homebrew packages
        run: brew install meson ninja pkg-config dtc xz lld sshpass go cmake zstd
      - uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.guest }}
          path: |
            work/out/Image
            work/out/Image.inputs.json
            work/out/initramfs.cpio.gz
            work/out/initramfs.cpio.gz.inputs.json
            work/out/steamac-layer.img
            work/out/steamac-layer.img.inputs.json
            work/out/mesa-venus
            work/out/mesa-venus.inputs.json
            work/out/mesa-aarch64.inputs.json
            work/out/mesa-x86.inputs.json
            work/out/kernel.config
            work/out/guest-toolchain.json
            work/cache/licenses
            work/cache/cargo-home/registry
            work/cache/kernel/*.tar.xz
            work/cache/dosfstools/*/*.tar.gz
            work/cache/e2fsprogs/*/*.tar.xz
            work/cache/btrfs-progs/*/*.tar.xz
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          key: frame-bridge-${{ github.run_id }}
          path: work/bridge/FrameBridge.zip
          fail-on-cache-miss: true
      - name: unpack Frame Bridge
        run: cd work/bridge && ditto -x -k FrameBridge.zip .
      # The executor library (libwmtr_host.dylib): DXMT's Metal executor, the VR exporter and the VideoToolbox
      # encoder behind the guest's Vulkan Video layer (Steam Frame streaming). bundle.sh ships it when it exists, so
      # a failure here still gives an app (without Frame streaming and DXMT); the log says why.
      # The Mac libraries (MoltenVK, KosmicKrisp, libepoxy, virglrenderer, libkrun, the executor library) and the
      # sources licenses.sh reads: reused while their inputs are unchanged, so a launcher change builds in minutes
      - name: reuse the Mac libraries of an earlier run with the same inputs
        id: hostdeps
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.hostdeps }}
          path: |
            work/out/host
            !work/out/host/llvm15
            work/build/host-libkrun/src
            !work/build/host-libkrun/src/target
            !work/build/host-libkrun/src/linux-sysroot
            work/build/host-virglrenderer/src
            work/build/host-moltenvk/src
            work/build/host-moltenvk/SPIRV-Cross
            !work/build/host-moltenvk/src/External/build
            work/build/host-kosmickrisp/src
            work/build/host-libepoxy/src
            work/cache/dxmt
      - uses: actions/cache/restore@v4
        id: llvm15
        if: steps.hostdeps.outputs.cache-hit != 'true'
        with:
          key: llvm15-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('host/dxmt/pin.env') }}
          path: work/out/host/llvm15
      - name: executor library (DXMT + LLVM 15 + wmtr, with the VideoToolbox encoder test)
        id: wmtr
        if: steps.hostdeps.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          xcrun -sdk macosx -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          host/dxmt/build.sh fetch llvm native host
      - uses: actions/cache/save@v4
        if: steps.hostdeps.outputs.cache-hit != 'true' && steps.llvm15.outputs.cache-hit != 'true' && hashFiles('work/out/host/llvm15/.pin') != ''
        with:
          key: llvm15-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('host/dxmt/pin.env') }}
          path: work/out/host/llvm15
      - name: crates of the guest's Rust agent (licenses.sh reads them offline; the guest job built it on Linux)
        env:
          CARGO_HOME: ${{ github.workspace }}/work/cache/cargo-home
        run: cargo fetch --locked --manifest-path guest/progress-agent/Cargo.toml
      - name: version
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.2.${{ github.run_number }}" host/launcher/Info.plist
      - name: host build (MoltenVK, KosmicKrisp, libepoxy, virglrenderer, libkrun, launcher)
        env:
          FRAME_BRIDGE_APP: ${{ github.workspace }}/work/bridge/Frame Bridge.app
          # GitHub's macOS VMs have a paravirtual GPU without the features of real Apple GPUs (mesh shaders,
          # ...): the drivers' GPU repros run on a Mac instead (the build scripts' documented CI switches)
          MVK_SKIP_REPRO: "1"
          KK_SKIP_HOST_TESTS: "1"
        run: |
          if [ "${{ steps.hostdeps.outputs.cache-hit }}" = true ]; then
            echo "Mac libraries reused (same inputs): launcher only"
            # licenses.sh reads libkrun's crates from the default cargo home, which the reused build filled
            cargo fetch --locked --manifest-path work/build/host-libkrun/src/Cargo.toml
            host/launcher/build.sh
          else
            ./build.sh host
          fi
      - name: keep the Mac libraries for later runs
        if: steps.hostdeps.outputs.cache-hit != 'true' && steps.wmtr.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.hostdeps }}
          path: |
            work/out/host
            !work/out/host/llvm15
            work/build/host-libkrun/src
            !work/build/host-libkrun/src/target
            !work/build/host-libkrun/src/linux-sysroot
            work/build/host-virglrenderer/src
            work/build/host-moltenvk/src
            work/build/host-moltenvk/SPIRV-Cross
            !work/build/host-moltenvk/src/External/build
            work/build/host-kosmickrisp/src
            work/build/host-libepoxy/src
            work/cache/dxmt

      - name: launcher self-tests (no VM; reported)
        continue-on-error: true
        run: |
          app="work/out/MacFrame.app/Contents/MacOS/MacFrame"
          ls "work/out/MacFrame.app/Contents/Frameworks"
          for t in graphics-path remote-play; do echo "=== --selftest-$t"; "$app" "--selftest-$t"; done
          echo "=== --selftest-setup"; "$app" --selftest-setup --selftest-out "$PWD/setup-shots"
      - name: setup assistant screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-assistant
          path: setup-shots
          if-no-files-found: ignore
          retention-days: 14
      - name: zip the app
        run: |
          cd work/out
          ditto -c -k --keepParent "MacFrame.app" "$GITHUB_WORKSPACE/MacFrame.zip"
          du -sh "MacFrame.app" "$GITHUB_WORKSPACE/MacFrame.zip"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="0.2.${{ github.run_number }}"
          gh release create "v$v" MacFrame.zip --target "${{ github.sha }}" --title "MacFrame $v" \
            --notes "Download MacFrame.zip, unzip it and drag MacFrame to Applications. The first time, right-click MacFrame > Open (it is not notarized by Apple). The setup assistant does the rest.

          Built from ${{ github.sha }}. Steam Frame streaming encoder: ${{ steps.hostdeps.outputs.cache-hit == 'true' && 'reused' || steps.wmtr.outcome }}."
