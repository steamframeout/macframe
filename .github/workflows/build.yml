# Builds the all-in-one app: the SteamOS VM launcher (FX Steam Launcher fork with the VR work) with the Steam Frame
# Wireless Adapter bridge inside. Result: a pre-release on the Releases page with Frame-VR.zip (the .app, signed ad
# hoc: open it with right-click > Open the first time).
#
# Jobs hand files to each other through the Actions cache (keyed by run), not artifacts: artifact storage is a
# per-account quota that other repositories can use up; the cache and release assets are separate.
#
#   guest-x86   x86_64 Linux: Venus + zink for FEX-emulated x86 apps (Mesa, amd64 container)
#   guest-arm   arm64 Linux:  guest kernel, verified SteamOS rootfs, aarch64 Mesa + verify, initramfs, layer image
#   bridge      x86_64 Linux: Frame Bridge.app (QEMU from Homebrew bottles + the adapter bridge image)
#   app         macOS 26:     MoltenVK, KosmicKrisp, libepoxy, virglrenderer, libkrun, the launcher; bundle + zip
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the release with the app

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - name: arm64 emulation (the source fetch runs in an arm64 container)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Mesa for x86 (Venus x86_64 + i386, zink, fault reporter)
        run: guest/mesa/build.sh fetch x86
      - uses: actions/cache/save@v4
        with:
          key: mesa-x86-${{ github.run_id }}
          path: |
            work/out/mesa-venus
            work/out/mesa-x86.inputs.json
            work/build/mesa-venus

  guest-arm:
    needs: guest-x86
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache; df -h /
      - name: amd64 emulation (only for the Mesa verify chroot's x86 checks)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64
      - uses: actions/cache/restore@v4
        with:
          key: mesa-x86-${{ github.run_id }}
          path: |
            work/out/mesa-venus
            work/out/mesa-x86.inputs.json
            work/build/mesa-venus
          fail-on-cache-miss: true
      - name: guest kernel
        run: guest/kernel/build.sh
      - name: SteamOS rootfs (Valve's signed OTA, verified)
        run: scripts/build-image.sh builder rootfs
      - name: Mesa for aarch64 + verify
        run: guest/mesa/build.sh fetch aarch64 verify
      - name: initramfs + layer image
        run: scripts/build-image.sh initramfs layer
      - uses: actions/cache/save@v4
        with:
          key: guest-${{ github.run_id }}
          path: |
            work/out/Image
            work/out/Image.inputs.json
            work/out/initramfs.cpio.gz
            work/out/initramfs.cpio.gz.inputs.json
            work/out/steamac-layer.img
            work/out/steamac-layer.img.inputs.json

  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: tools (rcodesign, macholib, Pillow)
        run: |
          pip3 install --break-system-packages macholib Pillow
          curl -fsSL -o /tmp/rcodesign.tar.gz \
            https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          tar -C /tmp -xzf /tmp/rcodesign.tar.gz
          sudo install /tmp/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign /usr/local/bin/rcodesign
      - name: Frame Bridge.app
        run: frame-bridge/macapp/build-app.sh "$PWD/work/bridge"
      - uses: actions/cache/save@v4
        with:
          key: frame-bridge-${{ github.run_id }}
          path: work/bridge/FrameBridge.zip

  app:
    needs: [guest-arm, bridge]
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Homebrew packages
        run: brew install meson ninja pkg-config dtc xz lld sshpass go
      - uses: actions/cache/restore@v4
        with:
          key: guest-${{ github.run_id }}
          path: |
            work/out/Image
            work/out/Image.inputs.json
            work/out/initramfs.cpio.gz
            work/out/initramfs.cpio.gz.inputs.json
            work/out/steamac-layer.img
            work/out/steamac-layer.img.inputs.json
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          key: frame-bridge-${{ github.run_id }}
          path: work/bridge/FrameBridge.zip
          fail-on-cache-miss: true
      - name: unpack Frame Bridge
        run: cd work/bridge && ditto -x -k FrameBridge.zip .
      - name: host build (MoltenVK, KosmicKrisp, libepoxy, virglrenderer, libkrun, launcher)
        env:
          FRAME_BRIDGE_APP: ${{ github.workspace }}/work/bridge/Frame Bridge.app
        run: ./build.sh host
      - name: zip the app
        run: |
          cd work/out
          ditto -c -k --keepParent "FX Steam Launcher.app" "$GITHUB_WORKSPACE/Frame-VR.zip"
          du -sh "FX Steam Launcher.app" "$GITHUB_WORKSPACE/Frame-VR.zip"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" Frame-VR.zip --prerelease --target "${{ github.sha }}" \
            --title "Frame VR build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Unzip, then right-click the app > Open the first time (signed ad hoc, not notarized)."
